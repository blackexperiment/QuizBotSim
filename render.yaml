services:
  - type: web
    name: quizbot-bot
    runtime: python
    pythonVersion: 3.11.10
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 main.py"

  - type: worker
    name: quizbot-worker
    runtime: python
    pythonVersion: 3.11.10
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 worker.py"
